name: iOS Build and UI Tests
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
      - name: Select iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if "iPhone" in v["name"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and test iPhone
        run: |
          set -o pipefail
          xcodebuild test -project ChangXi.xcodeproj -scheme ChangXi -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO -resultBundlePath artifacts/ChangXi.xcresult -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p artifacts/screenshots
          if [ -d artifacts/ChangXi.xcresult ]; then
            xcrun xcresulttool export attachments --path artifacts/ChangXi.xcresult --output-path artifacts/screenshots || true
          fi
          cp build.log artifacts/ 2>/dev/null || true
          cp -R ChangXi.xcodeproj artifacts/
      - name: Test iPad layouts
        run: |
          IPAD_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if "iPad" in v["name"]))')
          set -o pipefail
          xcodebuild test -project ChangXi.xcodeproj -scheme ChangXi -destination "platform=iOS Simulator,id=$IPAD_ID" -only-testing:ChangXiUITests -parallel-testing-enabled NO -resultBundlePath artifacts/iPad.xcresult -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO 2>&1 | tee artifacts/ipad-build.log
      - name: Export iPad screenshots
        if: always()
        run: |
          mkdir -p artifacts/ipad-screenshots
          if [ -d artifacts/iPad.xcresult ]; then
            xcrun xcresulttool export attachments --path artifacts/iPad.xcresult --output-path artifacts/ipad-screenshots || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-validation
          path: artifacts
          retention-days: 7
