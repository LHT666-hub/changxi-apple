name: iOS Quick Compile

on:
  push:
    branches: ['feat/quick-compile-v1']

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
      - name: Compile iOS app
        run: |
          set -o pipefail
          xcodebuild build \
            -project ChangXi.xcodeproj \
            -scheme ChangXi \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
