name: ChangXi
options:
  bundleIdPrefix: com.lht
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  ChangXi:
    type: application
    platform: iOS
    sources:
      - path: ChangXi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lht.changxi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 常曦
        INFOPLIST_KEY_NSCameraUsageDescription: 常曦仅在你主动拍摄报告、药盒或家中食材时使用相机。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 常曦仅在你主动发起语音输入时使用麦克风。
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 常曦仅在你配置局域网玄同服务后连接该服务。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 常曦将你主动输入的语音转成可修改的文字。
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
  ChangXiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit]
    dependencies:
      - target: ChangXi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ChangXiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: ChangXi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ChangXi:
    build:
      targets:
        ChangXi: all
    test:
      targets:
        - ChangXiTests
        - ChangXiUITests
      gatherCoverageData: true
